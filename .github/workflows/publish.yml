name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token: NuGet Trusted Publishing exchanges the GitHub OIDC token for a short-lived API key.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:MinVerSkip=true -p:Version=$VERSION

      - name: Test
        run: |
          dotnet test tests/FileVault.Core.Tests --no-build --configuration Release
          dotnet test tests/FileVault.Local.Tests --no-build --configuration Release
          dotnet test tests/FileVault.GoogleDrive.Tests --no-build --configuration Release --filter "Category!=Integration"
          dotnet test tests/FileVault.YandexDisk.Tests --no-build --configuration Release
          dotnet test tests/FileVault.GitHub.Tests --no-build --configuration Release --filter "Category!=Integration"
          dotnet test tests/FileVault.WebDav.Tests --no-build --configuration Release --filter "Category!=Integration"
          dotnet test tests/FileVault.OneDrive.Tests --no-build --configuration Release --filter "Category!=Integration"

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./nupkgs -p:MinVerSkip=true -p:Version=$VERSION

      - name: List packages
        run: ls -la ./nupkgs

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
